schema_version: 1

plugin:
  name: "google-oauth2-plugin"
  description: "Suppresses false positives from Google OAuth2 callback requests"
  long_description: |
    Detects legitimate Google OAuth2 authorization callback requests (GET
    requests carrying the standard state/code/scope parameters returned by
    Google's OAuth2 flow) and removes the ARGS:scope target from rule 930120
    (OS File Access Attempt), which otherwise false-positives on scope values
    such as ".../auth/userinfo.profile". Extra, non-standard GET parameters
    can be whitelisted so they don't disqualify a request from being
    recognized as a genuine callback.
  type: "official"
  category: "rule-exclusion"
  status: "tested"
  license: "Apache-2.0"
  authors:
    - name: "OWASP CRS Team"
      url: "https://coreruleset.org"
  repository: "https://github.com/coreruleset/google-oauth2-plugin"
  keywords:
    - "google"
    - "oauth2"
    - "false-positive"
    - "authentication"

rule_id_range:
  start: 9505000
  end: 9505999

compatibility:
  crs_version: ">=4.0.0"

configuration:
  file: "plugins/google-oauth2-config.conf"
  variables:
    - name: "tx.google-oauth2-plugin_enabled"
      type: "boolean"
      default: 1
      description: "Enable or disable the plugin (0 to disable)"
      required: false

    - name: "tx.google-oauth2-plugin_whitelisted_parameters"
      type: "list"
      default: ""
      description: >-
        Additional GET parameters allowed on the callback URL that are not
        part of the standard Google OAuth2 callback parameter set
        (state, code, scope, authuser, hd, prompt, iss)
      separator: " "
      prefix: "/"
      suffix: "/"
      example: "/param1/ /param2/ /param3/"
      required: false
